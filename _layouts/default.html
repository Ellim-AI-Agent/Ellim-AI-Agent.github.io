<!doctype html><html lang="{{ site.lang | default: 'ko' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>try{const t=localStorage.getItem("theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>{% seo %}<meta name="theme-color" content="#F6F7F3"><meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}"><meta name="twitter:image" content="{{ '/assets/og-image.png' | absolute_url }}"><link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml"><link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}"><link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}"><link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}"><link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}"></head><body id="top"><a class="skip-link" href="#main">본문으로 건너뛰기</a><div class="page">{% include header.html %}<main id="main">{{ content }}</main>{% include footer.html %}</div><script src="{{ '/assets/js/site.js' | relative_url }}" defer></script></body></html>
