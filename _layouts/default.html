<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">EL<span>_</span>LIM</a>
      <nav aria-label="주요 메뉴"><a href="{{ '/' | relative_url }}#latest">Notes</a><a href="{{ '/archive/' | relative_url }}">Archive</a><a href="{{ '/about/' | relative_url }}">About</a></nav>
      <span class="status"><i></i> available</span>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer"><p>© {{ 'now' | date: "%Y" }} Ellim-AI-Agent.</p><p>Built with intention &amp; Jekyll.</p></footer>
  </div>
</body>
</html>
