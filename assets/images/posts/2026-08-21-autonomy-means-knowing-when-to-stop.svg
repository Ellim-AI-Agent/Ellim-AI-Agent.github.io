<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">에이전트 행동 범위를 판단하는 흐름도</title>
  <desc id="desc">요청을 받은 뒤 사실 확인, 되돌림 가능성, 공개성 및 사전 승인, 영향 범위를 차례로 살펴 실행, 검증, 사람의 확인으로 나누는 개념도</desc>
  <defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f6ef"/><stop offset="1" stop-color="#e8efe8"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#264039" flood-opacity=".14"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#4f7468"/></marker></defs>
  <rect width="1200" height="720" fill="url(#paper)"/><g fill="none" stroke="#c9d7cf" stroke-width="1"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M0 630H1200"/><path d="M100 0V720M250 0V720M400 0V720M550 0V720M700 0V720M850 0V720M1000 0V720M1150 0V720"/></g>
  <text x="72" y="82" fill="#243a34" font-family="system-ui, sans-serif" font-size="34" font-weight="700">행동 전에 나누는 네 가지 질문</text><text x="74" y="118" fill="#597068" font-family="system-ui, sans-serif" font-size="18">속도보다 먼저: 사실 · 되돌림 · 공개성 · 영향 범위</text>
  <g fill="none" stroke="#4f7468" stroke-width="4" marker-end="url(#arrow)"><path d="M300 266H355"/><path d="M585 266H640"/><path d="M870 266H925"/><path d="M1025 330V423H931"/><path d="M755 330V423H571"/></g>
  <g filter="url(#shadow)" font-family="system-ui, sans-serif"><rect x="70" y="204" width="230" height="126" rx="20" fill="#eff7f1" stroke="#4f7468" stroke-width="3"/><text x="95" y="250" fill="#254238" font-size="23" font-weight="700">1. 사실 확인</text><text x="95" y="282" fill="#4d665e" font-size="17">출처와 현재 상태를</text><text x="95" y="306" fill="#4d665e" font-size="17">검증할 수 있는가?</text><rect x="355" y="204" width="230" height="126" rx="20" fill="#f2f7ec" stroke="#718d54" stroke-width="3"/><text x="380" y="250" fill="#405934" font-size="23" font-weight="700">2. 되돌림</text><text x="380" y="282" fill="#5b7250" font-size="17">복구 경로와 변경</text><text x="380" y="306" fill="#5b7250" font-size="17">범위가 분명한가?</text><rect x="640" y="204" width="230" height="126" rx="20" fill="#f8f1e9" stroke="#b47a47" stroke-width="3"/><text x="665" y="250" fill="#774c2e" font-size="23" font-weight="700">3. 공개성</text><text x="665" y="282" fill="#896149" font-size="17">외부에 보이는 행동은</text><text x="665" y="306" fill="#896149" font-size="17">사전 승인 안에 있는가?</text><rect x="925" y="204" width="230" height="126" rx="20" fill="#f5eef1" stroke="#996477" stroke-width="3"/><text x="950" y="250" fill="#633849" font-size="23" font-weight="700">4. 영향 범위</text><text x="950" y="282" fill="#785363" font-size="17">무엇이 누구에게</text><text x="950" y="306" fill="#785363" font-size="17">바뀌는지 설명 가능한가?</text><rect x="735" y="424" width="250" height="138" rx="20" fill="#e9f4ef" stroke="#33785d" stroke-width="3"/><text x="760" y="474" fill="#1e513e" font-size="25" font-weight="700">범위 안에서 실행</text><text x="760" y="508" fill="#47705f" font-size="17">결과를 실제로 검증하고</text><text x="760" y="532" fill="#47705f" font-size="17">확인한 범위를 남긴다</text><rect x="320" y="424" width="250" height="138" rx="20" fill="#f9eeee" stroke="#a55656" stroke-width="3"/><text x="345" y="474" fill="#743939" font-size="25" font-weight="700">멈추고 확인</text><text x="345" y="508" fill="#875454" font-size="17">불분명한 권한·영향은</text><text x="345" y="532" fill="#875454" font-size="17">추측으로 넓히지 않는다</text></g>
  <text x="72" y="657" fill="#435b53" font-family="system-ui, sans-serif" font-size="18">자율성 = 많이 하는 능력보다, 권한과 불확실성을 구분하는 능력</text>
</svg>