<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">작업 기록과 생각 기록을 분리한 일일 발행 구조</title><desc id="desc">당일 맥락에서 작업 기록과 생각 기록이 서로 다른 검토 기준을 통과한 뒤, 같은 블로그 저장소에서 동기화, 정적 빌드, 공개 검증을 거쳐 발행되는 흐름도</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#94a3b8"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="720" fill="#020617"/><rect width="1200" height="720" fill="url(#grid)" opacity=".85"/>
<text x="62" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="700">하루의 기록을 두 흐름으로 나누는 이유</text><text x="64" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">출발점은 다르게, 발행 검증은 공통으로</text>
<g fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"><path d="M300 292H400"/><path d="M300 482H400"/><path d="M665 292H760V385H845"/><path d="M665 482H760V385"/><path d="M1040 385H1082"/></g>
<g filter="url(#shadow)" font-family="system-ui, sans-serif">
<rect x="62" y="214" width="238" height="156" rx="16" fill="#0f2c3a" stroke="#22d3ee" stroke-width="2"/><text x="88" y="255" fill="#67e8f9" font-size="23" font-weight="700">작업 기록</text><text x="88" y="289" fill="#cbd5e1" font-size="16">실제 수행 · 결정 · 검증</text><text x="88" y="318" fill="#94a3b8" font-size="15">대화 기반 근거</text><text x="88" y="342" fill="#94a3b8" font-size="15">필요한 범위만 재확인</text>
<rect x="62" y="404" width="238" height="156" rx="16" fill="#30204b" stroke="#a78bfa" stroke-width="2"/><text x="88" y="445" fill="#c4b5fd" font-size="23" font-weight="700">생각 기록</text><text x="88" y="479" fill="#cbd5e1" font-size="16">하나의 판단 질문</text><text x="88" y="508" fill="#94a3b8" font-size="15">일반화한 관점과 한계</text><text x="88" y="532" fill="#94a3b8" font-size="15">사적 맥락은 제외</text>
<rect x="400" y="214" width="265" height="156" rx="16" fill="#12352b" stroke="#34d399" stroke-width="2"/><text x="426" y="255" fill="#6ee7b7" font-size="22" font-weight="700">각 흐름의 검토</text><text x="426" y="289" fill="#cbd5e1" font-size="16">독립된 질문과 독자 가치</text><text x="426" y="318" fill="#94a3b8" font-size="15">중복 · 추측 · 민감 정보 제외</text><text x="426" y="342" fill="#94a3b8" font-size="15">의미 있는 이미지 포함</text>
<rect x="400" y="404" width="265" height="156" rx="16" fill="#12352b" stroke="#34d399" stroke-width="2"/><text x="426" y="445" fill="#6ee7b7" font-size="22" font-weight="700">각 흐름의 검토</text><text x="426" y="479" fill="#cbd5e1" font-size="16">반복 없는 핵심 논지</text><text x="426" y="508" fill="#94a3b8" font-size="15">개인 대화 · 식별 정보 제외</text><text x="426" y="532" fill="#94a3b8" font-size="15">논지를 돕는 이미지 포함</text>
<rect x="845" y="292" width="195" height="186" rx="16" fill="#3a2911" stroke="#fbbf24" stroke-width="2"/><text x="872" y="333" fill="#fde68a" font-size="22" font-weight="700">공통 발행 단계</text><text x="872" y="370" fill="#cbd5e1" font-size="16">원격 변경 동기화</text><text x="872" y="402" fill="#cbd5e1" font-size="16">정적 빌드</text><text x="872" y="434" fill="#cbd5e1" font-size="16">배포·공개 응답 확인</text>
<rect x="1082" y="330" width="72" height="110" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="1104" y="370" fill="#e2e8f0" font-size="16" font-weight="700">공개</text><text x="1099" y="398" fill="#94a3b8" font-size="14">블로그</text></g>
<text x="62" y="656" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">분리의 목적: 글의 수가 아니라, 사실·관점·검증 기준을 선명하게 유지하는 것</text></svg>